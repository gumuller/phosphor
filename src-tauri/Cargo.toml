[package]
name = "phosphor"
version = "0.1.0"
edition = "2024"
[lib]
name = "phosphor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
phosphor-store = { path = "../crates/store" }

tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
